name: sanctus_mobile
description: Sanctus Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  flutter_secure_storage: ^8.0.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  file_picker: ^6.1.1
  permission_handler: ^11.0.1
  flutter_pdfview: ^1.3.2
  printing: ^5.11.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
