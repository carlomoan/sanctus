name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            backend_target: 'x86_64-unknown-linux-gnu'
            backend_ext: ''
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            backend_target: 'x86_64-pc-windows-msvc'
            backend_ext: '.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      # Build frontend first so web/dist exists when Tauri bundles
      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Build backend
        run: cargo build --release --target ${{ matrix.backend_target }}
        working-directory: backend
        env:
          SQLX_OFFLINE: true

      - name: Prepare sidecar binary
        shell: bash
        run: |
          mkdir -p backend/src-tauri/binaries
          cp \
            "backend/target/${{ matrix.backend_target }}/release/sanctus_backend${{ matrix.backend_ext }}" \
            "backend/src-tauri/binaries/sanctus-backend-${{ matrix.target }}${{ matrix.backend_ext }}"
          ls -lh backend/src-tauri/binaries/

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Sanctus v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          projectPath: ./backend
          args: ${{ matrix.args }}
          includeUpdaterJson: true
